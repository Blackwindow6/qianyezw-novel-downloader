name: Validate Userscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check qianyezw-downloader.user.js

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check qianyezw-downloader.user.js
